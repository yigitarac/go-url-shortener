<head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<div class="h-screen flex justify-center items-center bg-[#2e3440]">
    <div class="bg-[#3b4252] p-8 rounded-2xl shadow-2xl flex flex-col gap-5 w-96">

        <h1 class="text-white text-2xl font-bold text-center">URL Shortener</h1>

        <input id="linkBox"
               placeholder="Paste your long link..."
               class="bg-[#4c566a] text-white placeholder-gray-400 rounded-lg outline-none focus:ring-2 focus:ring-[#88c0d0] px-4 py-3 transition-all">

        <button id="shortenBtn"
                class="bg-[#81a1c1] text-white font-semibold rounded-lg px-4 py-3 hover:bg-[#5e81ac] transition-colors cursor-pointer">
            Shorten
        </button>

        <div id="resultContainer" class="hidden flex flex-col gap-3 mt-2">

            <div class="w-full h-px bg-[#4c566a]"></div>

            <a href="#" id="result" target="_blank"
               class="text-center text-[#88c0d0] hover:text-[#8fbcbb] font-medium truncate transition-colors">
            </a>

            <button id="copyBtn"
                    class="bg-[#4c566a] text-white text-sm rounded-lg hover:bg-[#434c5e] px-4 py-2 transition-colors cursor-pointer">
                Copy Link
            </button>
        </div>

    </div>
</div>


<script>

  const button = document.getElementById("shortenBtn");
  const box = document.getElementById("linkBox");
  const result = document.getElementById("result");
  const copy = document.getElementById("copyBtn");
  var link;
  var data;

  button.addEventListener("click", async function getInput() {
    const linkObject = {link: box.value}
    link = JSON.stringify(linkObject);

    var answer = await fetch("/shortener",{
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: link
    });
    data = await answer.json()
    result.href = "http://localhost:8080/p/" + data.shortLink
    document.getElementById("resultContainer").classList.remove("hidden");
  });

  copy.addEventListener("click", function copyLink() {
    var copyText = "http://localhost:8080/p/" + data.shortLink;
    navigator.clipboard.writeText(copyText);
    copy.innerText = "Copied!";
  });

</script>
